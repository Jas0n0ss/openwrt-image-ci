# Smoke test: container job must see repo files via $GITHUB_WORKSPACE (not github.workspace).
name: Validate container workspace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-lede.yml
      - .github/workflows/build-immortalwrt.yml
      - .github/workflows/validate-container.yml
      - docker/**

permissions:
  contents: read
  packages: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      builder_image: ${{ steps.image.outputs.ref }}
    steps:
      - id: image
        run: |
          ref="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/builder:22.04"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  validate:
    needs: setup
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.setup.outputs.builder_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify paths inside container
        run: |
          set -euo pipefail
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          test -n "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/scripts/setup-custom-packages.sh"
          test -f "$GITHUB_WORKSPACE/.github/ci/scrub-config-cycles.sh"
          test -d "$GITHUB_WORKSPACE/configs"
          echo "OK: container workspace paths valid"
