# 日常固件构建 — ImmortalWrt ImageBuilder + 缓存自定义 ipk（推荐）
# 前提：先跑 Build ipk（或 Build ImmortalWrt 全量）生成各架构 ipk

name: Build firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: "all"
        type: choice
        required: true
        default: all
        options:
          - all
          - xiaomi-ax3600
          - xiaomi-ax9000
          - xiaomi-wr30u
          - xiaomi-ax6000
          - redmi-ax6000
          - phicomm-k2p
          - xiaomi-cr660x
          - r2s
          - x86_64
          - raspberrypi-4b

permissions:
  contents: write
  actions: read

concurrency:
  group: firmware-${{ github.ref_name }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  IB_BASE: https://downloads.immortalwrt.org/snapshots

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        run: bash .github/ci/resolve-matrix.sh "${{ github.event.inputs.device || 'all' }}"

  build:
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: firmware · ${{ matrix.device }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve arch
        id: arch
        run: |
          set -euo pipefail
          source .github/ci/lib/device.sh
          arch="$(arch_from_config "configs/immortalwrt/${{ matrix.device }}.config")"
          echo "name=$arch" >> "$GITHUB_OUTPUT"

      - name: Restore custom ipk cache
        uses: actions/cache/restore@v4
        with:
          path: ipk-cache/${{ steps.arch.outputs.name }}
          key: ipk-${{ steps.arch.outputs.name }}-${{ github.run_id }}
          restore-keys: |
            ipk-${{ steps.arch.outputs.name }}-
            ipk-immortalwrt-${{ steps.arch.outputs.name }}-

      - name: Fetch custom ipk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/ci/fetch-ipk-cache.sh \
            "${{ steps.arch.outputs.name }}" \
            "${{ github.workspace }}/ipk-cache" \
            "${{ github.repository }}"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zstd curl gh

      - name: Build image
        run: |
          bash .github/ci/imagebuilder-build.sh \
            "${{ matrix.device }}" \
            "${{ github.workspace }}/configs" \
            "${{ github.workspace }}" \
            "${{ github.workspace }}/ipk-cache" \
            "${{ github.workspace }}/release/${{ matrix.device }}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v5
        with:
          name: fw-firmware-${{ matrix.device }}
          path: release/${{ matrix.device }}
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all firmware
        uses: actions/download-artifact@v5
        with:
          pattern: fw-firmware-*
          path: artifacts
          merge-multiple: true

      - name: Bundle into one release
        run: |
          bash .github/ci/release-bundle.sh \
            immortalwrt fw-firmware "${{ github.event.inputs.device || 'all' }}"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: firmware-${{ github.run_number }}
          name: "Firmware Build #${{ github.run_number }}"
          body: |
            日常固件（ImageBuilder + 自定义 ipk），全部设备合并在**一个 Release** 下。
            自定义插件来自 Build ipk 或最近一次全量编译。
          files: release/Jas0n0ss-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
