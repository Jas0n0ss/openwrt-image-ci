name: Build LEDE

on:
  workflow_dispatch:
    inputs:
      device:
        description: "all"
        type: choice
        required: true
        default: all
        options:
          - all
          - xiaomi-ax3600
          - xiaomi-ax9000
          - xiaomi-wr30u
          - xiaomi-ax6000
          - redmi-ax6000
          - phicomm-k2p
          - xiaomi-cr660x
          - r2s
          - x86_64
          - raspberrypi-4b
  # 已关闭自动构建：优化配置后在 Actions 手动 Run workflow
  # push:
  #   branches: [main]

permissions:
  contents: write
  packages: read

concurrency:
  group: lede-${{ github.ref_name }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  REPO: lede
  UPSTREAM: coolsnowwolf/lede
  SRC_DIR: src
  CCACHE_DIR: ~/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 10G

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      builder_image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - id: image
        run: |
          ref="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/builder:22.04"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - id: resolve
        run: |
          set -euo pipefail
          DEVICE="${{ github.event.inputs.device || 'all' }}"
          mapfile -t ALL_DEVICES < <(sed 's/#.*//' configs/devices.list | xargs -n1 | grep -v '^$')
          if [ "$DEVICE" = "all" ] || [ -z "$DEVICE" ]; then
            json=$(printf '"%s",' "${ALL_DEVICES[@]}" | sed 's/,$//')
            echo "matrix={\"device\":[${json}]}" >> "$GITHUB_OUTPUT"
          else
            for d in "${ALL_DEVICES[@]}"; do
              [ "$d" = "$DEVICE" ] && { echo "matrix={\"device\":[\"${DEVICE}\"]}" >> "$GITHUB_OUTPUT"; exit 0; }
            done
            echo "ERROR: unknown device '$DEVICE'" >&2; exit 1
          fi

  build:
    needs: setup
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.setup.outputs.builder_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: lede · ${{ matrix.device }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: master
          path: ${{ env.SRC_DIR }}
          fetch-depth: 1

      - name: Verify CI workspace
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/scripts/setup-custom-packages.sh"
          test -d "$GITHUB_WORKSPACE/configs"

      - name: Cache dl
        uses: actions/cache@v5
        with:
          path: ${{ env.SRC_DIR }}/dl
          key: dl-lede-${{ hashFiles('configs/**', 'scripts/setup-custom-packages.sh') }}
          restore-keys: dl-lede-

      - name: Cache feeds
        uses: actions/cache@v5
        with:
          path: ${{ env.SRC_DIR }}/feeds
          key: feeds-lede-v5-${{ hashFiles('configs/**', 'scripts/**', '.github/ci/**') }}
          restore-keys: feeds-lede-v5-

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-lede-${{ matrix.device }}-${{ hashFiles('configs/lede/common.config', 'configs/custom-plugins.config') }}
          restore-keys: ccache-lede-${{ matrix.device }}-

      - name: Setup feeds and packages
        working-directory: ${{ env.SRC_DIR }}
        run: bash $GITHUB_WORKSPACE/scripts/setup-custom-packages.sh . append $GITHUB_WORKSPACE/configs

      - name: Prepare overlay
        run: |
          bash scripts/generate-banner.sh lede files
          bash scripts/bundle-oh-my-bash.sh files
          bash scripts/install-files-overlay.sh "${{ env.SRC_DIR }}" files

      - name: Generate .config
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE/configs/lede/${{ matrix.device }}.config" > .config
          cat "$GITHUB_WORKSPACE/configs/lede/common.config" >> .config
          cat "$GITHUB_WORKSPACE/configs/custom-plugins.config" >> .config
          for snip in \
            "$GITHUB_WORKSPACE/configs/snippets/wireless-core.config" \
            "$GITHUB_WORKSPACE/configs/snippets/luci-zh-cn.config" \
            "$GITHUB_WORKSPACE/configs/snippets/no-rust-passwall.config" \
            "$GITHUB_WORKSPACE/configs/snippets/no-selinux.config"; do
            [ -f "$snip" ] && cat "$snip" >> .config
          done
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          sed -i \
            -e '/^CONFIG_PACKAGE_dnsmasq-full=y$/d' \
            -e '/^CONFIG_PACKAGE_dnsmasq_full_/d' \
            -e '/^CONFIG_PACKAGE_nftables-json=y$/d' \
            -e '/^CONFIG_PACKAGE_nftables-nojson=y$/d' \
            -e '/^CONFIG_PACKAGE_luci-app-turboacc/d' \
            -e '/^CONFIG_PACKAGE_kmod-nft-fullcone=y$/d' \
            -e '/^CONFIG_PACKAGE_kmod-tcp-bbr=y$/d' \
            .config
          {
            echo "# CONFIG_PACKAGE_dnsmasq-full is not set"
            echo "# CONFIG_PACKAGE_nftables-json is not set"
            echo "# CONFIG_PACKAGE_nftables-nojson is not set"
          } >> .config

      - name: Defconfig and TurboACC
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/.github/ci/patch-kconfig-tree.sh"
          export PATCH_OVERLAY="$GITHUB_WORKSPACE/scripts/overlays"
          bash "$PATCH" .
          make defconfig > defconfig.log 2>&1 || { echo "make defconfig failed:"; cat defconfig.log; exit 1; }
          if grep -q 'recursive dependency detected' defconfig.log; then
            echo "=== Kconfig recursive dependency (defconfig) ==="
            grep -E 'recursive dependency|symbol PACKAGE_' defconfig.log || true
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/.github/ci/scrub-config-cycles.sh" .config
          bash "$PATCH" .
          rm -rf tmp/.config-package.in tmp/.config-target.in tmp/.config-feeds.in 2>/dev/null || true
          cat "$GITHUB_WORKSPACE/configs/snippets/turboacc.config" >> .config
          make oldconfig > oldconfig.log 2>&1 || { echo "make oldconfig failed:"; cat oldconfig.log; exit 1; }
          if grep -q 'recursive dependency detected' oldconfig.log; then
            echo "=== Kconfig recursive dependency (oldconfig) ==="
            grep -E 'recursive dependency|symbol PACKAGE_' oldconfig.log || true
            exit 1
          fi

      - name: Compile
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          make download -j8
          make -j"$(nproc)" || make -j1 V=s

      - name: Pack firmware
        working-directory: ${{ env.SRC_DIR }}
        run: |
          bash $GITHUB_WORKSPACE/.github/ci/pack-firmware.sh \
            "${{ matrix.device }}" lede \
            "$GITHUB_WORKSPACE/configs/lede/${{ matrix.device }}.config" \
            bin/targets "../release/${{ matrix.device }}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v5
        with:
          name: fw-lede-${{ matrix.device }}
          path: release/${{ matrix.device }}
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all firmware
        uses: actions/download-artifact@v5
        with:
          pattern: fw-lede-*
          path: artifacts
          merge-multiple: true

      - name: Bundle into one release
        env:
          DEVICE_INPUT: ${{ github.event.inputs.device || 'all' }}
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          files=(artifacts/**/Jas0n0ss-*)
          [ "${#files[@]}" -gt 0 ] || { echo "ERROR: no firmware files downloaded" >&2; exit 1; }
          cp -t release/ "${files[@]}"
          echo "Bundled ${#files[@]} firmware file(s) into one release:"
          ls -la release/
          if [ "$DEVICE_INPUT" = "all" ]; then
            while IFS= read -r dev; do
              [ -n "$dev" ] || continue
              ls release/Jas0n0ss-lede-"${dev}"-* >/dev/null 2>&1 \
                || { echo "ERROR: missing firmware for device: $dev" >&2; exit 1; }
            done < <(sed 's/#.*//' configs/devices.list | xargs -n1 | grep -v '^$')
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: lede-${{ github.run_number }}
          name: "LEDE Build #${{ github.run_number }}"
          body: |
            本次构建全部固件合并在**一个 Release** 下，可直接批量下载。
            命名：`Jas0n0ss-lede-<代号>-<设备>-<平台>-<类型>.<后缀>`
          files: release/Jas0n0ss-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
