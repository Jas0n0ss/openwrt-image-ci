# 全量编译 LEDE — 手动触发，可选设备

name: Build LEDE

on:
  workflow_dispatch:
    inputs:
      device:
        description: "设备（all = 全部编译）"
        type: choice
        required: true
        default: all
        options:
          - all
          - xiaomi-ax3600
          - xiaomi-ax9000
          - xiaomi-wr30u
          - xiaomi-ax6000
          - redmi-ax6000
          - phicomm-k2p
          - xiaomi-cr660x
          - r2s
          - x86_64
          - raspberrypi-4b

permissions:
  contents: write

concurrency:
  group: lede-${{ github.ref_name }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  UPSTREAM: coolsnowwolf/lede
  SRC_DIR: src
  CCACHE_DIR: ~/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 10G

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        run: |
          set -euo pipefail
          source .github/scripts/lib/device.sh
          PICK="${{ github.event.inputs.device || 'all' }}"
          mapfile -t ALL < <(list_devices configs/devices.list)
          if [ "$PICK" = "all" ] || [ -z "$PICK" ]; then
            json=$(printf '"%s",' "${ALL[@]}" | sed 's/,$//')
            echo "matrix={\"device\":[${json}]}" >> "$GITHUB_OUTPUT"
          else
            for d in "${ALL[@]}"; do
              [ "$d" = "$PICK" ] && {
                echo "matrix={\"device\":[\"${PICK}\"]}" >> "$GITHUB_OUTPUT"
                exit 0
              }
            done
            echo "ERROR: unknown device '$PICK'" >&2; exit 1
          fi

  build:
    needs: setup
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/openwrt-builder:latest
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: lede · ${{ matrix.device }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: master
          path: ${{ env.SRC_DIR }}
          fetch-depth: 1

      - name: Cache dl
        uses: actions/cache@v5
        with:
          path: ${{ env.SRC_DIR }}/dl
          key: dl-lede-${{ hashFiles('configs/**', '.github/scripts/setup-custom-packages.sh') }}
          restore-keys: dl-lede-

      - name: Cache feeds
        uses: actions/cache@v5
        with:
          path: ${{ env.SRC_DIR }}/feeds
          key: feeds-lede-v7-${{ hashFiles('configs/**', 'overlays/**', '.github/scripts/**') }}
          restore-keys: feeds-lede-v7-

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-lede-${{ matrix.device }}-${{ hashFiles('configs/lede/common.config', 'configs/custom-plugins.config') }}
          restore-keys: ccache-lede-${{ matrix.device }}-

      - name: Cache oh-my-bash
        uses: actions/cache@v5
        with:
          path: files/etc/oh-my-bash
          key: omb-v1

      - name: Setup feeds and packages
        working-directory: ${{ env.SRC_DIR }}
        run: bash $GITHUB_WORKSPACE/.github/scripts/setup-custom-packages.sh . append $GITHUB_WORKSPACE/configs

      - name: Prepare overlay
        run: |
          set -euo pipefail
          # Banner
          cp overlays/banners/lede.banner files/etc/banner
          echo "lede" > files/etc/jas0n0ss-build-source
          # oh-my-bash (skip on cache hit)
          OMB_DIR="files/etc/oh-my-bash"
          if [ ! -f "$OMB_DIR/oh-my-bash.sh" ]; then
            rm -rf "$OMB_DIR"
            git clone --depth 1 --branch master \
              https://github.com/ohmybash/oh-my-bash.git "$OMB_DIR"
            rm -rf "$OMB_DIR/.git"
          fi
          # Copy files/ overlay into src
          mkdir -p "${{ env.SRC_DIR }}/files"
          cp -a files/. "${{ env.SRC_DIR }}/files/"
          chmod +x "${{ env.SRC_DIR }}/files/etc/uci-defaults/"* 2>/dev/null || true

      - name: Generate .config
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE/configs/lede/${{ matrix.device }}.config" > .config
          cat "$GITHUB_WORKSPACE/configs/lede/common.config" >> .config
          cat "$GITHUB_WORKSPACE/configs/custom-plugins.config" >> .config
          for snip in wireless-core luci-zh-cn no-rust-passwall no-selinux; do
            f="$GITHUB_WORKSPACE/configs/snippets/$snip.config"
            [ -f "$f" ] && cat "$f" >> .config
          done
          printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          sed -i \
            -e '/^CONFIG_PACKAGE_dnsmasq-full=y$/d' \
            -e '/^CONFIG_PACKAGE_dnsmasq_full_/d' \
            -e '/^CONFIG_PACKAGE_luci-app-turboacc/d' \
            -e '/^CONFIG_PACKAGE_kmod-nft-fullcone=y$/d' \
            -e '/^CONFIG_PACKAGE_kmod-tcp-bbr=y$/d' \
            .config
          echo "# CONFIG_PACKAGE_dnsmasq-full is not set" >> .config

      - name: Defconfig and TurboACC
        working-directory: ${{ env.SRC_DIR }}
        run: bash $GITHUB_WORKSPACE/.github/scripts/defconfig-turboacc.sh .

      - name: Compile
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          make download -j"$(nproc)"
          make toolchain/compile -j"$(nproc)" || make toolchain/compile -j1 V=s
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect custom ipk
        id: ipk
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          PKG_ROOT="bin/packages"
          if [ ! -d "$PKG_ROOT" ]; then
            echo "No bin/packages found, skipping ipk collection" >&2
            echo "arch=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t arches < <(find "$PKG_ROOT" -mindepth 1 -maxdepth 1 -type d \
            -exec basename {} \; | sort -u)
          ARCH="${arches[0]:-none}"
          [ "$ARCH" = "none" ] && { echo "arch=none" >> "$GITHUB_OUTPUT"; exit 0; }
          arch_dir="$PKG_ROOT/$ARCH/packages"
          out="../ipk-staging/$ARCH"
          mkdir -p "$out"
          shopt -s nullglob
          for pat in luci-app-passwall passwall hysteria mosdns v2dat \
            turboacc nft-fullcone luci-theme-aurora luci-app-arpbind \
            xray-core sing-box; do
            for ipk in "$arch_dir"/${pat}*.ipk; do cp -a "$ipk" "$out/"; done
          done
          shopt -u nullglob
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      - name: Save custom ipk cache
        if: steps.ipk.outputs.arch != 'none'
        uses: actions/cache/save@v5
        with:
          path: ipk-staging/${{ steps.ipk.outputs.arch }}
          key: ipk-lede-${{ steps.ipk.outputs.arch }}-${{ github.run_id }}

      - name: Upload ipk artifact
        if: steps.ipk.outputs.arch != 'none'
        uses: actions/upload-artifact@v5
        with:
          name: lede-ipk-${{ steps.ipk.outputs.arch }}
          path: ipk-staging/${{ steps.ipk.outputs.arch }}
          retention-days: 30
          if-no-files-found: warn

      - name: Pack firmware
        working-directory: ${{ env.SRC_DIR }}
        run: |
          bash $GITHUB_WORKSPACE/.github/scripts/pack-firmware.sh \
            "${{ matrix.device }}" lede \
            "$GITHUB_WORKSPACE/configs/lede/${{ matrix.device }}.config" \
            bin/targets "../release/${{ matrix.device }}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v5
        with:
          name: fw-lede-${{ matrix.device }}
          path: release/${{ matrix.device }}
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all firmware
        uses: actions/download-artifact@v5
        with:
          pattern: fw-lede-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s globstar nullglob
          files=(artifacts/**/Jas0n0ss-*)
          [ "${#files[@]}" -gt 0 ] || { echo "ERROR: no firmware files" >&2; exit 1; }
          cp -t release/ "${files[@]}"
          echo "Bundled ${#files[@]} firmware file(s)"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: lede-${{ github.run_number }}
          name: "LEDE Build #${{ github.run_number }}"
          body: |
            本次构建全部固件合并在**一个 Release** 下，可直接批量下载。
            命名：`Jas0n0ss-lede-<代号>-<设备>-<平台>-<类型>.<后缀>`
          files: release/Jas0n0ss-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
