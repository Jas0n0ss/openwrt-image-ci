# 全量编译 LEDE（高级，数小时）— 日常 ImmortalWrt 请用 Build firmware

name: Build LEDE

on:
  workflow_dispatch:
    inputs:
      device:
        description: "all"
        type: choice
        required: true
        default: all
        options:
          - all
          - xiaomi-ax3600
          - xiaomi-ax9000
          - xiaomi-wr30u
          - xiaomi-ax6000
          - redmi-ax6000
          - phicomm-k2p
          - xiaomi-cr660x
          - r2s
          - x86_64
          - raspberrypi-4b
  # 已关闭自动构建：优化配置后在 Actions 手动 Run workflow
  # push:
  #   branches: [main]

permissions:
  contents: write

concurrency:
  group: lede-${{ github.ref_name }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  REPO: lede
  UPSTREAM: coolsnowwolf/lede
  SRC_DIR: src
  CCACHE_DIR: ~/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 10G

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        run: bash .github/ci/resolve-matrix.sh "${{ github.event.inputs.device || 'all' }}"

  build:
    needs: setup
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: lede · ${{ matrix.device }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: master
          path: ${{ env.SRC_DIR }}
          fetch-depth: 1

      - name: Verify CI workspace
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/.github/ci/setup-custom-packages.sh"
          test -d "$GITHUB_WORKSPACE/configs"

      - name: Install build dependencies
        run: bash $GITHUB_WORKSPACE/.github/ci/install-build-deps.sh

      - name: Cache dl
        uses: actions/cache@v5
        with:
          path: ${{ env.SRC_DIR }}/dl
          key: dl-lede-${{ hashFiles('configs/**', '.github/ci/setup-custom-packages.sh') }}
          restore-keys: dl-lede-

      - name: Cache feeds
        uses: actions/cache@v5
        with:
          path: ${{ env.SRC_DIR }}/feeds
          key: feeds-lede-v7-${{ hashFiles('configs/**', 'overlays/**', '.github/ci/**') }}
          restore-keys: feeds-lede-v7-

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-lede-${{ matrix.device }}-${{ hashFiles('configs/lede/common.config', 'configs/custom-plugins.config') }}
          restore-keys: ccache-lede-${{ matrix.device }}-

      - name: Cache oh-my-bash
        uses: actions/cache@v5
        with:
          path: files/etc/oh-my-bash
          key: omb-${{ hashFiles('.github/ci/bundle-oh-my-bash.sh') }}

      - name: Setup feeds and packages
        working-directory: ${{ env.SRC_DIR }}
        run: bash $GITHUB_WORKSPACE/.github/ci/setup-custom-packages.sh . append $GITHUB_WORKSPACE/configs

      - name: Prepare overlay
        run: bash $GITHUB_WORKSPACE/.github/ci/prepare-overlay.sh lede "${{ env.SRC_DIR }}"

      - name: Generate .config
        working-directory: ${{ env.SRC_DIR }}
        run: |
          bash $GITHUB_WORKSPACE/.github/ci/merge-config.sh \
            lede "${{ matrix.device }}" .

      - name: Defconfig and TurboACC
        working-directory: ${{ env.SRC_DIR }}
        run: bash $GITHUB_WORKSPACE/.github/ci/defconfig-turboacc.sh .

      - name: Compile
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          make download -j"$(nproc)"
          make toolchain/compile -j"$(nproc)" || make toolchain/compile -j1 V=s
          make -j"$(nproc)" || make -j1 V=s

      - name: Pack firmware
        working-directory: ${{ env.SRC_DIR }}
        run: |
          bash $GITHUB_WORKSPACE/.github/ci/pack-firmware.sh \
            "${{ matrix.device }}" lede \
            "$GITHUB_WORKSPACE/configs/lede/${{ matrix.device }}.config" \
            bin/targets "../release/${{ matrix.device }}"

      - name: Collect custom ipk
        id: ipk
        working-directory: ${{ env.SRC_DIR }}
        run: |
          arch="$(bash $GITHUB_WORKSPACE/.github/ci/collect-ipk.sh \
            . "$GITHUB_WORKSPACE/configs" "../ipk-staging" lede)"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"

      - name: Save custom ipk cache
        uses: actions/cache/save@v5
        with:
          path: ipk-staging/${{ steps.ipk.outputs.arch }}
          key: ipk-lede-${{ steps.ipk.outputs.arch }}-${{ github.run_id }}

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v5
        with:
          name: lede-ipk-${{ steps.ipk.outputs.arch }}
          path: ipk-staging/${{ steps.ipk.outputs.arch }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v5
        with:
          name: fw-lede-${{ matrix.device }}
          path: release/${{ matrix.device }}
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all firmware
        uses: actions/download-artifact@v5
        with:
          pattern: fw-lede-*
          path: artifacts
          merge-multiple: true

      - name: Bundle into one release
        run: |
          bash .github/ci/release-bundle.sh \
            lede fw-lede "${{ github.event.inputs.device || 'all' }}"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: lede-${{ github.run_number }}
          name: "LEDE Build #${{ github.run_number }}"
          body: |
            本次构建全部固件合并在**一个 Release** 下，可直接批量下载。
            命名：`Jas0n0ss-lede-<代号>-<设备>-<平台>-<类型>.<后缀>`
          files: release/Jas0n0ss-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
