name: Build builder Docker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/**
      - .github/workflows/docker-builder-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-builder-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/builder:22.04
            ghcr.io/${{ github.repository }}/builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "Published:"
          echo "  ghcr.io/${{ github.repository }}/builder:22.04"
          echo "  ghcr.io/${{ github.repository }}/builder:latest"
