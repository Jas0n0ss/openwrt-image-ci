# 全量编译 ImmortalWrt（高级，数小时）— 日常请用 Build firmware + Build ipk

name: Build ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      device:
        description: "all"
        type: choice
        required: true
        default: all
        options:
          - all
          - xiaomi-ax3600
          - xiaomi-ax9000
          - xiaomi-wr30u
          - xiaomi-ax6000
          - redmi-ax6000
          - phicomm-k2p
          - xiaomi-cr660x
          - r2s
          - x86_64
          - raspberrypi-4b
  # 已关闭自动构建：优化配置后在 Actions 手动 Run workflow
  # push:
  #   branches: [main]
  # schedule:
  #   - cron: "0 20 * * 0"

permissions:
  contents: write
  packages: read

concurrency:
  group: immortalwrt-${{ github.ref_name }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  REPO: immortalwrt
  UPSTREAM: immortalwrt/immortalwrt
  SRC_DIR: src
  CCACHE_DIR: ~/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 10G

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      builder_image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - id: image
        run: |
          source .github/ci/lib/device.sh
          echo "ref=$(builder_image_ref '${{ github.repository }}')" >> "$GITHUB_OUTPUT"
      - id: resolve
        run: bash .github/ci/resolve-matrix.sh "${{ github.event.inputs.device || 'all' }}"

  build:
    needs: setup
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.setup.outputs.builder_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: immortalwrt · ${{ matrix.device }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: master
          path: ${{ env.SRC_DIR }}
          fetch-depth: 1

      - name: Verify CI workspace
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/scripts/setup-custom-packages.sh"
          test -d "$GITHUB_WORKSPACE/configs"

      - name: Cache dl
        uses: actions/cache@v5
        with:
          path: ${{ env.SRC_DIR }}/dl
          key: dl-immortalwrt-${{ hashFiles('configs/**', 'scripts/setup-custom-packages.sh') }}
          restore-keys: dl-immortalwrt-

      - name: Cache feeds
        uses: actions/cache@v5
        with:
          path: ${{ env.SRC_DIR }}/feeds
          key: feeds-immortalwrt-v5-${{ hashFiles('configs/**', 'scripts/**', '.github/ci/**') }}
          restore-keys: feeds-immortalwrt-v5-

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-immortalwrt-${{ matrix.device }}-${{ hashFiles('configs/immortalwrt/common.config', 'configs/custom-plugins.config') }}
          restore-keys: ccache-immortalwrt-${{ matrix.device }}-

      - name: Setup feeds and packages
        working-directory: ${{ env.SRC_DIR }}
        run: bash $GITHUB_WORKSPACE/scripts/setup-custom-packages.sh . append $GITHUB_WORKSPACE/configs

      - name: Prepare overlay
        run: bash $GITHUB_WORKSPACE/.github/ci/prepare-overlay.sh immortalwrt "${{ env.SRC_DIR }}"

      - name: Generate .config
        working-directory: ${{ env.SRC_DIR }}
        run: |
          bash $GITHUB_WORKSPACE/.github/ci/merge-config.sh \
            immortalwrt "${{ matrix.device }}" .

      - name: Defconfig and TurboACC
        working-directory: ${{ env.SRC_DIR }}
        run: bash $GITHUB_WORKSPACE/.github/ci/defconfig-turboacc.sh .

      - name: Compile
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          make download -j8
          make toolchain/compile -j"$(nproc)" || make toolchain/compile -j1 V=s
          make -j"$(nproc)" || make -j1 V=s

      - name: Pack firmware
        working-directory: ${{ env.SRC_DIR }}
        run: |
          bash $GITHUB_WORKSPACE/.github/ci/pack-firmware.sh \
            "${{ matrix.device }}" immortalwrt \
            "$GITHUB_WORKSPACE/configs/immortalwrt/${{ matrix.device }}.config" \
            bin/targets "../release/${{ matrix.device }}"

      - name: Collect custom ipk
        id: ipk
        working-directory: ${{ env.SRC_DIR }}
        run: |
          arch="$(bash $GITHUB_WORKSPACE/.github/ci/collect-ipk.sh \
            . "$GITHUB_WORKSPACE/configs" "../ipk-staging")"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"

      - name: Save custom ipk cache
        uses: actions/cache/save@v4
        with:
          path: ipk-staging/${{ steps.ipk.outputs.arch }}
          key: ipk-${{ steps.ipk.outputs.arch }}-${{ github.run_id }}

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v5
        with:
          name: immortalwrt-ipk-${{ steps.ipk.outputs.arch }}
          path: ipk-staging/${{ steps.ipk.outputs.arch }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v5
        with:
          name: fw-immortalwrt-${{ matrix.device }}
          path: release/${{ matrix.device }}
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all firmware
        uses: actions/download-artifact@v5
        with:
          pattern: fw-immortalwrt-*
          path: artifacts
          merge-multiple: true

      - name: Bundle into one release
        run: |
          bash .github/ci/release-bundle.sh \
            immortalwrt fw-immortalwrt "${{ github.event.inputs.device || 'all' }}"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: immortalwrt-${{ github.run_number }}
          name: "ImmortalWrt Build #${{ github.run_number }}"
          body: |
            本次构建全部固件合并在**一个 Release** 下，可直接批量下载。
            命名：`Jas0n0ss-immortalwrt-<代号>-<设备>-<平台>-<类型>.<后缀>`
          files: release/Jas0n0ss-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
