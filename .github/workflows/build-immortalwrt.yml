name: Build ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      device:
        description: "all"
        type: choice
        required: true
        default: all
        options:
          - all
          - xiaomi-ax3600
          - xiaomi-ax9000
          - xiaomi-wr30u
          - xiaomi-ax6000
          - redmi-ax6000
          - phicomm-k2p
          - xiaomi-cr660x
          - r2s
          - x86_64
          - raspberrypi-4b
  # 已关闭自动构建：优化配置后在 Actions 手动 Run workflow
  # push:
  #   branches: [main]
  # schedule:
  #   - cron: "0 20 * * 0"

permissions:
  contents: write

concurrency:
  group: immortalwrt-${{ github.ref_name }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  REPO: immortalwrt
  UPSTREAM: immortalwrt/immortalwrt
  SRC_DIR: src
  CCACHE_DIR: ~/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 10G

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        run: |
          set -euo pipefail
          DEVICE="${{ github.event.inputs.device || 'all' }}"
          mapfile -t ALL_DEVICES < <(sed 's/#.*//' configs/devices.list | xargs -n1 | grep -v '^$')
          if [ "$DEVICE" = "all" ] || [ -z "$DEVICE" ]; then
            json=$(printf '"%s",' "${ALL_DEVICES[@]}" | sed 's/,$//')
            echo "matrix={\"device\":[${json}]}" >> "$GITHUB_OUTPUT"
          else
            for d in "${ALL_DEVICES[@]}"; do
              [ "$d" = "$DEVICE" ] && { echo "matrix={\"device\":[\"${DEVICE}\"]}" >> "$GITHUB_OUTPUT"; exit 0; }
            done
            echo "ERROR: unknown device '$DEVICE'" >&2; exit 1
          fi

  build:
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: immortalwrt · ${{ matrix.device }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: master
          path: ${{ env.SRC_DIR }}
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo docker image prune -af || true

      - name: Cache dl
        uses: actions/cache@v5
        with:
          path: ${{ env.SRC_DIR }}/dl
          key: dl-immortalwrt-${{ hashFiles('configs/**', 'scripts/setup-custom-packages.sh') }}
          restore-keys: dl-immortalwrt-

      - name: Cache feeds
        uses: actions/cache@v5
        with:
          path: ${{ env.SRC_DIR }}/feeds
          key: feeds-immortalwrt-v3-${{ hashFiles('configs/**', 'scripts/setup-custom-packages.sh') }}
          restore-keys: feeds-immortalwrt-v3-

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-immortalwrt-${{ matrix.device }}-${{ hashFiles('configs/immortalwrt/common.config', 'configs/custom-plugins.config') }}
          restore-keys: ccache-immortalwrt-${{ matrix.device }}-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gettext \
            git libssl-dev libelf-dev python3 python3-dev python3-distutils \
            rsync unzip zlib1g-dev file wget subversion patch upx-ucl ccache \
            ecj fastjar java-propose-classpath libncurses5-dev libncursesw5-dev \
            libz-dev curl cmake jq rename tar

      - name: Setup feeds and packages
        working-directory: ${{ env.SRC_DIR }}
        run: bash ${{ github.workspace }}/scripts/setup-custom-packages.sh . append ${{ github.workspace }}/configs

      - name: Prepare overlay
        run: |
          bash scripts/generate-banner.sh immortalwrt files
          bash scripts/bundle-oh-my-bash.sh files
          bash scripts/install-files-overlay.sh "${{ env.SRC_DIR }}" files

      - name: Generate .config
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          cat "${{ github.workspace }}/configs/immortalwrt/${{ matrix.device }}.config" > .config
          cat "${{ github.workspace }}/configs/immortalwrt/common.config" >> .config
          cat "${{ github.workspace }}/configs/custom-plugins.config" >> .config
          for snip in \
            "${{ github.workspace }}/configs/snippets/wireless-core.config" \
            "${{ github.workspace }}/configs/snippets/luci-zh-cn.config" \
            "${{ github.workspace }}/configs/snippets/no-rust-passwall.config" \
            "${{ github.workspace }}/configs/snippets/no-selinux.config"; do
            [ -f "$snip" ] && cat "$snip" >> .config
          done
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          sed -i \
            -e '/^CONFIG_PACKAGE_dnsmasq-full=y$/d' \
            -e '/^CONFIG_PACKAGE_dnsmasq_full_/d' \
            -e '/^CONFIG_PACKAGE_nftables-json=y$/d' \
            -e '/^CONFIG_PACKAGE_nftables-nojson=y$/d' \
            -e '/^CONFIG_PACKAGE_luci-app-turboacc/d' \
            -e '/^CONFIG_PACKAGE_kmod-nft-fullcone=y$/d' \
            -e '/^CONFIG_PACKAGE_kmod-tcp-bbr=y$/d' \
            .config
          {
            echo "# CONFIG_PACKAGE_dnsmasq-full is not set"
            echo "# CONFIG_PACKAGE_nftables-json is not set"
            echo "# CONFIG_PACKAGE_nftables-nojson is not set"
          } >> .config

      - name: Defconfig and TurboACC
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          STASH=".ci-stash-turboacc"
          mkdir -p "$STASH"
          for d in luci-app-turboacc nft-fullcone; do
            [ -d "package/$d" ] && mv "package/$d" "$STASH/$d"
          done
          make defconfig > defconfig.log 2>&1 || { echo "make defconfig failed:"; cat defconfig.log; exit 1; }
          if grep -q 'recursive dependency detected' defconfig.log; then
            echo "=== Kconfig recursive dependency (defconfig) ==="
            grep -E 'recursive dependency|symbol PACKAGE_' defconfig.log || true
            for sym in dnsmasq-full luci-app-turboacc kmod-nft-fullcone nftables-json nftables-nojson luci-ssl luci-app-unblockneteasemusic; do
              if grep -q "^CONFIG_PACKAGE_${sym}=y" .config 2>/dev/null; then
                echo "ERROR: cycle-prone package enabled: ${sym}"
                exit 1
              fi
            done
          fi
          for d in luci-app-turboacc nft-fullcone; do
            [ -d "$STASH/$d" ] && mv "$STASH/$d" "package/$d"
          done
          cat "${{ github.workspace }}/configs/snippets/turboacc.config" >> .config
          make oldconfig > oldconfig.log 2>&1 || { echo "make oldconfig failed:"; cat oldconfig.log; exit 1; }
          if grep -q 'recursive dependency detected' oldconfig.log; then
            echo "=== Kconfig recursive dependency (oldconfig) ==="
            grep -E 'recursive dependency|symbol PACKAGE_' oldconfig.log || true
            exit 1
          fi

      - name: Compile
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          make download -j8
          make toolchain/compile -j"$(nproc)" || make toolchain/compile -j1 V=s
          make -j"$(nproc)" || make -j1 V=s

      - name: Pack firmware
        working-directory: ${{ env.SRC_DIR }}
        run: |
          bash ${{ github.workspace }}/.github/ci/pack-firmware.sh \
            "${{ matrix.device }}" immortalwrt \
            "${{ github.workspace }}/configs/immortalwrt/${{ matrix.device }}.config" \
            bin/targets "../release/${{ matrix.device }}"

      - name: Collect custom ipk for fast builds
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          ROOT="${{ github.workspace }}/configs"
          PKG_ROOT="bin/packages"
          [ -d "$PKG_ROOT" ] || { echo "ERROR: $PKG_ROOT not found" >&2; exit 1; }
          mapfile -t arches < <(find "$PKG_ROOT" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort -u)
          [ "${#arches[@]}" -gt 0 ] || { echo "ERROR: no arch under $PKG_ROOT" >&2; exit 1; }
          ARCH="${arches[0]}"
          arch_dir="$PKG_ROOT/$ARCH/packages"
          [ -d "$arch_dir" ] || { echo "ERROR: missing $arch_dir" >&2; exit 1; }
          dest="../ipk-staging/$ARCH"
          mkdir -p "$dest"
          found=0
          extract_pkgs() {
            local cfg
            for cfg in "$@"; do
              [ -f "$cfg" ] || continue
              grep -E '^CONFIG_PACKAGE_[A-Za-z0-9][A-Za-z0-9._+-]*=y' "$cfg" \
                | sed 's/^CONFIG_PACKAGE_//;s/=y$//' | grep -vE '_INCLUDE_|_Including_' || true
            done
          }
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            shopt -s nullglob
            for ipk in "$arch_dir"/${pkg}*.ipk; do cp -a "$ipk" "$dest/"; found=1; done
            shopt -u nullglob
          done < <(extract_pkgs "$ROOT/immortalwrt/common.config" "$ROOT/custom-plugins.config" "$ROOT/snippets/turboacc.config" | sort -u)
          for pattern in luci-app-passwall passwall hysteria mosdns v2dat turboacc nft-fullcone \
            luci-theme-aurora luci-app-arpbind xray-core sing-box; do
            shopt -s nullglob
            for ipk in "$arch_dir"/${pattern}*.ipk; do cp -a "$ipk" "$dest/"; found=1; done
            shopt -u nullglob
          done
          [ "$found" -eq 1 ] || { echo "ERROR: no custom ipk in $arch_dir" >&2; exit 1; }
          echo "arch=$ARCH" >> "$GITHUB_ENV"
          echo "Collected ipk for $ARCH: $(find "$dest" -name '*.ipk' | wc -l) files"

      - name: Save custom ipk cache
        uses: actions/cache/save@v4
        with:
          path: ipk-staging/${{ env.arch }}
          key: ipk-immortalwrt-${{ env.arch }}-${{ github.run_id }}

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v5
        with:
          name: immortalwrt-ipk-${{ env.arch }}
          path: ipk-staging/${{ env.arch }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v5
        with:
          name: fw-immortalwrt-${{ matrix.device }}
          path: release/${{ matrix.device }}
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all firmware
        uses: actions/download-artifact@v5
        with:
          pattern: fw-immortalwrt-*
          path: artifacts
          merge-multiple: true

      - name: Bundle into one release
        env:
          DEVICE_INPUT: ${{ github.event.inputs.device || 'all' }}
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          files=(artifacts/**/Jas0n0ss-*)
          [ "${#files[@]}" -gt 0 ] || { echo "ERROR: no firmware files downloaded" >&2; exit 1; }
          cp -t release/ "${files[@]}"
          echo "Bundled ${#files[@]} firmware file(s) into one release:"
          ls -la release/
          if [ "$DEVICE_INPUT" = "all" ]; then
            while IFS= read -r dev; do
              [ -n "$dev" ] || continue
              ls release/Jas0n0ss-immortalwrt-"${dev}"-* >/dev/null 2>&1 \
                || { echo "ERROR: missing firmware for device: $dev" >&2; exit 1; }
            done < <(sed 's/#.*//' configs/devices.list | xargs -n1 | grep -v '^$')
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: immortalwrt-${{ github.run_number }}
          name: "ImmortalWrt Build #${{ github.run_number }}"
          body: |
            本次构建全部固件合并在**一个 Release** 下，可直接批量下载。
            命名：`Jas0n0ss-immortalwrt-<代号>-<设备>-<平台>-<类型>.<后缀>`
          files: release/Jas0n0ss-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
