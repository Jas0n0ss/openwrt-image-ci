# ImmortalWrt 快速构建 — 官方 ImageBuilder + 自定义 ipk（类似 firmware-selector）
# 前提：先跑过一次 Build ImmortalWrt（全量）以生成并缓存自定义 ipk

name: Build ImmortalWrt (Fast)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "设备 (all = 全部 10 台)"
        type: choice
        required: true
        default: all
        options:
          - all
          - xiaomi-ax3600
          - xiaomi-ax9000
          - xiaomi-wr30u
          - xiaomi-ax6000
          - redmi-ax6000
          - phicomm-k2p
          - xiaomi-cr660x
          - r2s
          - x86_64
          - raspberrypi-4b
  # 已关闭自动构建：优化配置后在 Actions 手动 Run workflow
  # push:
  #   branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: immortalwrt-fast-${{ github.ref_name }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  IB_BASE: https://downloads.immortalwrt.org/snapshots

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        run: |
          set -euo pipefail
          DEVICE="${{ github.event.inputs.device || 'all' }}"
          mapfile -t ALL_DEVICES < <(sed 's/#.*//' configs/devices.list | xargs -n1 | grep -v '^$')
          if [ "$DEVICE" = "all" ] || [ -z "$DEVICE" ]; then
            json=$(printf '"%s",' "${ALL_DEVICES[@]}" | sed 's/,$//')
            echo "matrix={\"device\":[${json}]}" >> "$GITHUB_OUTPUT"
          else
            for d in "${ALL_DEVICES[@]}"; do
              [ "$d" = "$DEVICE" ] && { echo "matrix={\"device\":[\"${DEVICE}\"]}" >> "$GITHUB_OUTPUT"; exit 0; }
            done
            echo "ERROR: unknown device '$DEVICE'" >&2; exit 1
          fi

  build:
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: fast · ${{ matrix.device }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve arch
        id: arch
        run: |
          set -euo pipefail
          CFG="configs/immortalwrt/${{ matrix.device }}.config"
          if grep -q '^CONFIG_TARGET_x86_64=y' "$CFG"; then arch=x86_64
          elif grep -q '^CONFIG_TARGET_qualcommax_ipq807x=y' "$CFG"; then arch=aarch64_cortex-a53
          elif grep -q '^CONFIG_TARGET_mediatek_filogic=y' "$CFG"; then arch=aarch64_cortex-a53
          elif grep -q '^CONFIG_TARGET_ramips_mt7621=y' "$CFG"; then arch=mips_24kc
          elif grep -q '^CONFIG_TARGET_rockchip_armv8=y' "$CFG"; then arch=aarch64_generic
          elif grep -q '^CONFIG_TARGET_bcm27xx_bcm2711=y' "$CFG"; then arch=aarch64_cortex-a72
          else echo "ERROR: unknown target in $CFG" >&2; exit 1; fi
          echo "name=$arch" >> "$GITHUB_OUTPUT"

      - name: Restore custom ipk cache
        uses: actions/cache/restore@v4
        with:
          path: ipk-cache/${{ steps.arch.outputs.name }}
          key: ipk-immortalwrt-${{ steps.arch.outputs.name }}-${{ github.run_id }}
          restore-keys: |
            ipk-immortalwrt-${{ steps.arch.outputs.name }}-
            ipk-immortalwrt-mips_24kc-
            ipk-immortalwrt-mipsel_24kc-
            ipk-immortalwrt-aarch64_cortex-a53-
            ipk-immortalwrt-aarch64_generic-
            ipk-immortalwrt-aarch64_cortex-a72-
            ipk-immortalwrt-x86_64-

      - name: Check custom ipk
        id: ipk-ready
        run: |
          set -euo pipefail
          arch="${{ steps.arch.outputs.name }}"
          cache="ipk-cache"
          try_dir() { [ -d "$1" ] && [ -n "$(find "$1" -maxdepth 1 -name '*.ipk' -print -quit 2>/dev/null)" ]; }
          if try_dir "$cache" || try_dir "$cache/$arch"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            for alt in mips_24kc mipsel_24kc aarch64_cortex-a53 aarch64_generic aarch64_cortex-a72 x86_64; do
              try_dir "$cache/$alt" && { echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; }
            done
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download ipk from last full build
        if: steps.ipk-ready.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          arch="${{ steps.arch.outputs.name }}"
          mkdir -p "ipk-cache/$arch"
          names=(
            "immortalwrt-ipk-${arch}"
            immortalwrt-ipk-mips_24kc
            immortalwrt-ipk-mipsel_24kc
            immortalwrt-ipk-aarch64_cortex-a53
            immortalwrt-ipk-aarch64_generic
            immortalwrt-ipk-aarch64_cortex-a72
            immortalwrt-ipk-x86_64
          )
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            for name in "${names[@]}"; do
              rm -rf "ipk-cache/$arch"/*
              if gh run download "$run_id" -R "${{ github.repository }}" -n "$name" -D "ipk-cache/$arch" 2>/dev/null \
                && [ -n "$(find "ipk-cache/$arch" -name '*.ipk' -print -quit)" ]; then
                echo "Downloaded $name from full build run $run_id"
                exit 0
              fi
            done
          done < <(gh run list --repo "${{ github.repository }}" \
            --workflow=build-immortalwrt.yml --status=success --limit=30 \
            --json databaseId -q '.[].databaseId')
          echo "ERROR: no ipk artifact found — run Build ImmortalWrt (full) for this arch first" >&2
          exit 1

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zstd curl gh

      - name: Build image
        run: |
          bash .github/ci/imagebuilder-build.sh \
            "${{ matrix.device }}" \
            "${{ github.workspace }}/configs" \
            "${{ github.workspace }}" \
            "${{ github.workspace }}/ipk-cache" \
            "${{ github.workspace }}/release/${{ matrix.device }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: immortalwrt-fast-${{ matrix.device }}
          path: release/${{ matrix.device }}
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all firmware
        uses: actions/download-artifact@v5
        with:
          pattern: immortalwrt-fast-*
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -name 'Jas0n0ss-*' -exec cp -t release/ {} +
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: immortalwrt-fast-${{ github.run_number }}
          name: "ImmortalWrt Fast Build #${{ github.run_number }}"
          body: |
            ImageBuilder 快速构建，全部 10 台设备固件。
            自定义插件来自最近一次全量编译缓存的 ipk。
          files: release/Jas0n0ss-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
